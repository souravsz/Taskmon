plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'in.aakri.taskmon'
version = '1.0.0'

android {
  namespace "expo.modules.banksms"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // HeadlessJsTaskService: runs the app's JS task for an SMS while the app is closed
  compileOnly "com.facebook.react:react-android"
}
